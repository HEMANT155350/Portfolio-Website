<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auth - HEMANT</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="sign-in.css">
    <script src="sign-in.js" defer></script>
</head>

<body class="auth-body">

    <div class="auth-card">
        <a href="index.html" class="back-home">
            <i class="fa-solid fa-arrow-left"></i> Home
        </a>

        <!-- ================= SIGN IN FORM ================= -->
        <div id="signin-box" class="hidden">
            <h2>Welcome Back 👋</h2>
            <p class="auth-subtitle">Sign in to continue to portfolio</p>

            <form class="auth-form">
                <div class="input-group">
                    <i class="fa-regular fa-envelope"></i>
                    <input type="email" placeholder="Email Address" required>
                </div>

                <div class="input-group">
                    <i class="fa-solid fa-lock"></i>
                    <input type="password" placeholder="Password" required>
                </div>

                <div class="auth-options">
                    <label><input type="checkbox"> Remember me</label>
                    <a href="#">Forgot password?</a>
                </div>

                <button type="submit" class="submit-btn">Sign In</button>

                <div class="divider"><span>OR</span></div>

                <div class="social-auth">
                    <button type="button" class="social-login-btn"><i class="fa-brands fa-google"></i> Google</button>
                    <button type="button" class="social-login-btn"><i class="fa-brands fa-facebook"></i> Facebook</button>
                </div>

                <p class="signup-link">Don't have an account? <a href="javascript:void(0)" onclick="toggleAuth()">Sign
                        Up</a></p>
            </form>
        </div>

        <!-- ================= SIGN UP FORM ================= -->
        <div id="signup-box">
            <h2>Create Account ✨</h2>
            <p class="auth-subtitle">Sign up to get started</p>

            <form class="auth-form">
                <div class="input-group">
                    <i class="fa-regular fa-user"></i>
                    <input type="text" placeholder="Full Name" required>
                </div>

                <div class="input-group">
                    <i class="fa-regular fa-envelope"></i>
                    <input type="email" placeholder="Email Address" required>
                </div>

                <div class="input-group">
                    <i class="fa-solid fa-lock"></i>
                    <input type="password" placeholder="Password" required>
                </div>

                <button type="submit" class="submit-btn">Create Account</button>

                <div class="divider"><span>OR</span></div>

                <div class="social-auth">
                    <button type="button" class="social-login-btn"><i class="fa-brands fa-google"></i> Google</button>
                    <button type="button" class="social-login-btn"><i class="fa-brands fa-facebook"></i> Facebook</button>
                </div>

                <p class="signup-link">Already have an account? <a href="javascript:void(0)" onclick="toggleAuth()">Sign
                        In</a></p>
            </form>
        </div>

    </div>
</body>

</html>
